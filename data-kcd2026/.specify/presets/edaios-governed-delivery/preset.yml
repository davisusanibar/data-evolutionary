schema_version: "1.0"
preset:
  id: "edaios-governed-delivery"
  name: "EDAIOS Foundation Projection"
  version: "3.1.0"
  description: "Workflow Spec Kit agnostico gobernado por Foundation, ADR/RFC, valor y gates EDAIOS"
  author: "EDAIOS"
  license: "MIT"
requires:
  speckit_version: ">=0.12.11"
provides:
  templates:
    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Verifica la proyeccion constitucional EDAIOS"
      strategy: "replace"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Crea una spec con contrato y trazabilidad EDAIOS"
      strategy: "replace"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Aclara requisitos antes del plan"
      strategy: "replace"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Evalua calidad de requisitos"
      strategy: "replace"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Genera un plan condicionado por Constitucion y ADR"
      strategy: "replace"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Genera tareas con cobertura de requisitos"
      strategy: "replace"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Analiza coherencia y cobertura antes de implementar"
      strategy: "replace"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Implementa bajo gates EDAIOS"
      strategy: "replace"
tags:
  - "edaios"
  - "multi-initiative"
  - "governance"
  - "sdd"
