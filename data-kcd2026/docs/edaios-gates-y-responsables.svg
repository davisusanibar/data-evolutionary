  <g>
    <rect x="530" y="168" width="440" height="252" fill="#ffffff" stroke="#9c6626" stroke-width="1.6" rx="8"/>
    <circle cx="560" cy="198" r="15" fill="#9c6626"/><text class="mono num" x="560" y="203" text-anchor="middle">2</text>
    <text class="mono ct" x="586" y="196">Revisión del plan</text>
