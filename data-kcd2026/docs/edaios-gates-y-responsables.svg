    <text class="mono lbl" x="548" y="294">EJECUTA</text><text class="mono val" x="636" y="294">humano</text>
    <text class="mono lbl" x="548" y="316">DECIDE</text><text class="mono val" x="636" y="316" style="fill:#9c6626;font-weight:700">arquitectura / owner</text>
    <rect x="548" y="332" width="300" height="28" fill="#fdf2ef" stroke="#b4432f" rx="5"/>
    <text class="mono badge" x="562" y="351" style="fill:#6d2116">ESQUIVABLE — solo vive en el runner</text>
    <text class="mono src" x="548" y="392">.specify/workflows/edaios-delivery/workflow.yml:42</text>
  </g>
  <line x1="970" y1="294" x2="1010" y2="294" stroke="#9c6626" stroke-width="2" marker-end="url(#ar)"/>

