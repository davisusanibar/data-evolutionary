      .zone{font-size:12px;font-weight:700;letter-spacing:1.7px}
      .ct{font-size:15px;font-weight:700;fill:#16202a}
      .cw{font-size:10.5px;fill:#6b5f42;letter-spacing:.3px}
      .lbl{font-size:9.5px;fill:#8a7a5c;font-weight:700;letter-spacing:1.1px}
      .val{font-size:11.5px;fill:#2c3742}
      .src{font-size:10px;fill:#8a7a5c}
      .num{font-size:13px;font-weight:700;fill:#fdfcf8}
      .badge{font-size:11px;font-weight:700}
    </style>
  </defs>

  <rect width="1500" height="1170" fill="#f6f3ea"/>
  <rect width="1500" height="1170" fill="url(#grid)"/>
  <rect x="14" y="14" width="1472" height="1142" fill="none" stroke="#c9ba97" stroke-width="1.5" rx="8"/>

  <!-- CABECERA -->
  <text class="mono eyebrow" x="44" y="56">FEATURE 001 · PERFIL CONSUMER-RELEASE · ESTADO VERIFICADO 2026-07-18</text>
  <text class="sans h1" x="44" y="92">Las puertas y quién responde de cada una</text>
  <text class="sans h2" x="44" y="116">Seis puertas atraviesa un cambio. Solo una no se puede esquivar: la que está soldada al build. Las otras cinco esperan a que alguien decida ejecutarlas.</text>

  <!-- ================= PUERTAS ================= -->
