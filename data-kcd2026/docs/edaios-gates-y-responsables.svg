<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1170" width="1500" height="1170" role="img" aria-label="Las puertas de control de la feature 001 y sus responsables">
  <title>Puertas de control y responsables — data-kcd2026</title>
  <desc>Las seis puertas que atraviesa un cambio, qué verifica cada una, quién la ejecuta, quién decide y si se puede esquivar; más las dos puertas no instaladas y los actores con autoridad declarada.</desc>

  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#78684a" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9c6626"/>
    </marker>
    <style>
      .mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
      .sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
      .h1{font-size:31px;font-weight:700;fill:#16202a;letter-spacing:-.4px}
      .h2{font-size:15px;fill:#5f5643}
