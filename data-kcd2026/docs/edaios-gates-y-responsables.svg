  <!-- 1 -->
  <g>
    <rect x="44" y="168" width="440" height="252" fill="#ffffff" stroke="#9c6626" stroke-width="1.6" rx="8"/>
    <circle cx="74" cy="198" r="15" fill="#9c6626"/><text class="mono num" x="74" y="203" text-anchor="middle">1</text>
    <text class="mono ct" x="100" y="196">Revisión de la spec</text>
    <text class="mono cw" x="100" y="212">TRAS EL CHECKLIST, ANTES DEL PLAN</text>
    <line x1="62" y1="230" x2="466" y2="230" stroke="#e3dccb"/>
    <text class="mono lbl" x="62" y="250">VERIFICA</text>
    <text class="mono val" x="62" y="268">alcance, valor, sensibilidad y requisitos</text>
    <text class="mono lbl" x="62" y="294">EJECUTA</text><text class="mono val" x="150" y="294">humano</text>
    <text class="mono lbl" x="62" y="316">DECIDE</text><text class="mono val" x="150" y="316" style="fill:#9c6626;font-weight:700">owner · david-susanibar</text>
    <rect x="62" y="332" width="300" height="28" fill="#fdf2ef" stroke="#b4432f" rx="5"/>
    <text class="mono badge" x="76" y="351" style="fill:#6d2116">ESQUIVABLE — solo vive en el runner</text>
    <text class="mono src" x="62" y="392">.specify/workflows/edaios-delivery/workflow.yml:34</text>
  </g>
  <line x1="484" y1="294" x2="524" y2="294" stroke="#9c6626" stroke-width="2" marker-end="url(#ar)"/>

