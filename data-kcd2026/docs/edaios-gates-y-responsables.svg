    <rect x="1016" y="168" width="440" height="252" fill="#ffffff" stroke="#2f7d84" stroke-width="1.8" rx="8"/>
    <circle cx="1046" cy="198" r="15" fill="#2f7d84"/><text class="mono num" x="1046" y="203" text-anchor="middle">3</text>
    <text class="mono ct" x="1072" y="196">Gate SDD contractual</text>
    <text class="mono cw" x="1072" y="212">HOOKS after_tasks Y before_implement</text>
    <line x1="1034" y1="230" x2="1438" y2="230" stroke="#e3dccb"/>
    <text class="mono lbl" x="1034" y="250">VERIFICA</text>
